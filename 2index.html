<head>

        /* element selector */
        p {

        }
        .box {
            width: 200px;

        }
        /* id selector */
        #intro {
            color:blue;
            /* width: 200px;
            height: 100px;
            border: 2px solid black; */
        }
        p.note {
            color: red;
        }
         .note {

        }
        div>p {

        }

</head>

    <p id="intro" class="note" >This is my paragraph</p>
